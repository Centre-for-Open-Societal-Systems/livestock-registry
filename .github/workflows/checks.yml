name: Checks
on:
  push:
    branches: ["**", "!dependabot/**"]
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest==8.4.2 ruff==0.17.2 PyYAML==6.0.2 Jinja2 httpx PyJWT cryptography 'sqlalchemy[asyncio]>=2' aiosqlite orjson
      - name: Source and deployment contracts
        run: bash ci/validate.sh
      - name: Native image extension checks
        run: |
          docker build -f ci/refactor/profile-tests.Dockerfile -t registry-reference-tests .
          docker run --rm --network none --entrypoint python -v "$PWD:/work:ro" -w /work -e REGISTRY_EXTENSION_MODULE=openg2p_registry_livestock_extension -e PYTHONPATH=/work/livestock-extension/src registry-reference-tests -m pytest -q -p no:cacheprovider livestock-extension/tests
      - name: Native metadata and notification mapping
        run: |
          COSS_REFACTOR_TEST_IMAGE=registry-reference-tests python ci/refactor/rehearse_metadata.py livestock --pipeline
          python ci/refactor/compare_new_dev.py livestock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-verification
          path: ci-output/

  popup-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble the immutable upstream UI with registered OAN widgets
        run: npm install --prefix ui/staff-ui --no-audit --no-fund
      - name: Install isolated browser test tooling
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Production popup widget and native data-path regression
        run: |
          mkdir -p ci-output/popup
          python ui/staff-ui/test/popup-flow/run_browser.py --node-modules ui/staff-ui/.app/node_modules --chromium --output ci-output/popup/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: popup-browser
          path: ci-output/popup/
