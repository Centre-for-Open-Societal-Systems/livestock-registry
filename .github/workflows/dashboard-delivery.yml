name: Dashboard delivery contract
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest PyYAML
      - run: python -m pytest -q test/test_oan_chart.py test/test_deployment_guard.py
