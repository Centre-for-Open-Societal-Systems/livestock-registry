name: Dashboard delivery
on:
  push:
  pull_request:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pytest PyYAML
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - name: Dashboard digest and semantic version label regressions
        run: python -m pytest test/test_dashboard_delivery.py -q
