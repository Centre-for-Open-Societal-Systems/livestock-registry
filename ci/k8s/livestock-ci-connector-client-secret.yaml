# New Dev: the connector upgrade (Gen2-Operator/livestock-registry, connector-upgrade; ci/connector/upgrade-livestock-connector.sh)
# ends with a check that mints a Keycloak client-credentials token for the admin-only connector API, reading the client
# secret from Secret commons/registry-connector. Grant the Livestock CI service account (livestock/livestock-ci, the
# identity of the livestock-dev-kubeconfig credential) get on exactly that one Secret, nothing else in commons.
# Same Role and binding as Crop (cropsown-regsitry ci/k8s/crop-ci-dev.yaml). Apply as cluster admin on the New Dev box:
#   sudo KUBECONFIG=/etc/rancher/rke2/rke2.yaml kubectl apply -f ci/k8s/livestock-ci-connector-client-secret.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-read-connector-client-secret
  namespace: commons
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["registry-connector"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: livestock-ci-connector-client-secret
  namespace: commons
subjects:
  - kind: ServiceAccount
    name: livestock-ci
    namespace: livestock
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-read-connector-client-secret
