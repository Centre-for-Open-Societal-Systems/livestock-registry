{{- if and .Values.reporting.views.enabled .Values.reporting.views.refreshSchedule }}
{{/*
Keep the lr_rpt_* views current.

They are MATERIALIZED: Postgres never updates them when the register changes,
so without this the dashboards stay frozen at the last install or upgrade.

Each run re-copies the geography from Master Data, then refreshes the views in
dependency order, resolved from the catalog (lr_rpt_animal reads
lr_rpt_holding). files/reporting-views-refresh.sh is the same script the farmer
registry uses: every outcome is a JSON line on stdout and a row in
reporting_refresh_log.
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-lr-reporting-views-refresh
  labels:
    app.kubernetes.io/name: lr-reporting-views-refresh
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedule: {{ .Values.reporting.views.refreshSchedule | quote }}
  # A refresh that overruns its slot must not have a second one started on top.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: lr-reporting-views-refresh
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          containers:
            - name: refresh
              image: {{ include "livestock.reporting.image" . | quote }}
              command:
                - sh
                - -c
                - |
                  /seed/reporting-geo-sync.sh || echo "[refresh] geography copy failed; refreshing with the existing lr_rpt_geo" >&2
{{ .Files.Get "files/reporting-views-refresh.sh" | indent 18 }}
              env:
                - name: MATCH_PREFIX
                  value: lr_rpt_
                - name: REFRESH_LOG_ENABLED
                  value: {{ .Values.reporting.views.refreshLog.enabled | toString | quote }}
                - name: REFRESH_LOG_RETENTION_DAYS
                  value: {{ .Values.reporting.views.refreshLog.retentionDays | toString | quote }}
                {{- include "livestock.reporting.dbEnv" . | nindent 16 }}
                {{- include "livestock.reporting.mdsEnv" . | nindent 16 }}
              resources: {{- toYaml .Values.reporting.resources | nindent 16 }}
{{- end }}
