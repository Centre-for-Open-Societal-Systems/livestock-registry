# Shared development staff IAM and wildcard Gateway. Secret contents stay outside Git.
environment: ''
iam:
  url: https://staff-iam.development.oanstaging.com
  cookieDomain: .development.oanstaging.com
links:
  staffPortalUrl: https://staff-portal.development.oanstaging.com
  registryPortalUrl: https://livestock-registry.development.oanstaging.com
dashboardApi:
  service: livestock-registry-dashboard-api
  auth:
    enabled: true
iamSetup:
  grantUsers: [admin]
  description: Livestock Dashboard
host: livestock-registry-dashboard.development.oanstaging.com
ingress:
  public:
    existingGateway: istio-system/development
